[project]
name = "bookmybooth-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["functions", "shared", "domain", "apigw", "tables", "helpers", "seed", "local_api"]
